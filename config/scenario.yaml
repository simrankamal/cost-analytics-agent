# Ground truth for RCA evaluation. factor multiplies quantity; add adds running count or quantity.
incidents:
  - {id: INC-01, kind: spike, account: prod-core, region: us-west-2, sku: ec2_c6i_xlarge, start: 2025-11-12, end: 2025-11-17, factor: 4.0,
     cause: Autoscaling group max capacity misconfigured after a deploy; workers scaled out and never scaled in}
  - {id: INC-02, kind: spike, account: prod-core, region: eu-west-1, sku: data_transfer_out, start: 2025-08-20, end: 2025-08-22, factor: 5.0,
     cause: CDN cache purge sent all EU traffic to origin}
  - {id: INC-03, kind: spike, account: prod-data, region: us-east-1, sku: nat_bytes, start: 2026-02-03, end: 2026-02-11, factor: 10.0,
     cause: ETL job pulled from S3 through the NAT gateway because the S3 gateway endpoint route was removed}
  - {id: INC-04, kind: level_shift, account: dev-sandbox, region: ap-south-1, sku: rds_pg_r6g_large, start: 2026-03-10, end: 2026-04-08, add: 6,
     cause: Load-test databases left running in the sandbox account}
  - {id: INC-05, kind: spike, account: staging, region: us-east-1, sku: cloudwatch_logs_ingest, start: 2026-05-05, end: 2026-05-08, factor: 8.0,
     cause: Debug log level enabled in staging and not reverted}
  - {id: INC-06, kind: spike, account: prod-core, region: us-east-1, sku: lambda_gb_seconds, start: 2026-08-14, end: 2026-08-14, factor: 20.0,
     cause: Recursive Lambda invocation loop between an S3 trigger and its own output prefix}
  - {id: INC-07, kind: level_shift, account: prod-data, region: us-west-2, sku: s3_standard_storage, start: 2025-10-01, end: 2026-09-30, factor: 1.4,
     cause: Replication rule widened to include the raw zone}
  - {id: INC-08, kind: drop, account: dev-sandbox, region: us-east-1, sku: elasticache_r6g_large, start: 2026-01-15, end: 2026-09-30, factor: 0.0,
     cause: Unused sandbox cache cluster deleted during a cleanup}
  - {id: INC-09, kind: commitment_expiry, account: prod-core, region: us-east-1, sku: ec2_m6i_large, start: 2026-07-01, end: 2026-09-30, commitment: ri-ec2-m6i-use1,
